<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>Reach Higher ABA - contact form</title>
<!-- Intentionally NO analytics, pixels, tag managers, fonts or other third-party scripts on this page. -->
<style>
html,body{margin:0;padding:0;background:transparent}
body{font-family:"Nunito","Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;color:#0B3B40;-webkit-font-smoothing:antialiased}
form{padding:4px 2px 2px;max-width:560px;margin:0 auto}
.intro{margin:0 0 14px;font-size:15px;line-height:1.45;color:#2F5A5F}
.row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
label.f{display:block;margin:0 0 12px}
label.f>span{display:block;margin:0 0 5px;font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#0B4F55}
input[type=text],input[type=email],input[type=tel]{display:block;width:100%;min-width:0;box-sizing:border-box;margin:0;height:50px;padding:0 14px;
  font-family:inherit;font-size:16px;font-weight:600;color:#0B3B40;background:rgba(255,255,255,.78);border:1px solid rgba(11,79,85,.20);
  border-radius:12px;outline:none;-webkit-appearance:none;appearance:none;box-shadow:inset 0 1px 2px rgba(11,79,85,.06);transition:border-color .15s,box-shadow .15s,background .15s}
input::placeholder{color:rgba(11,59,64,.40);font-weight:500}
input:focus{border-color:#1FCB8B;background:#fff;box-shadow:0 0 0 3px rgba(31,203,139,.25)}
.bad input[type=text],.bad input[type=email],.bad input[type=tel]{border-color:#E06363;box-shadow:0 0 0 3px rgba(224,99,99,.18)}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.c{display:flex;gap:10px;align-items:flex-start;margin:4px 0 6px;font-size:13px;line-height:1.5;color:#3C6166;cursor:pointer}
.c input{flex:0 0 auto;width:20px;height:20px;margin:1px 0 0;accent-color:#0B4F55;cursor:pointer}
.c.bad{color:#B23A3A}
.links{margin:0 0 14px 30px;font-size:12.5px}
.links a{color:#0B4F55;font-weight:700}
button{display:block;width:100%;min-height:54px;margin:0;border:0;border-radius:14px;background:#00D389;color:#073438;font-family:inherit;font-size:17px;font-weight:800;
  cursor:pointer;box-shadow:0 10px 24px rgba(0,180,120,.28);transition:transform .1s,filter .15s}
button:hover{filter:brightness(1.04)} button:active{transform:translateY(1px)} button[disabled]{opacity:.7;cursor:wait}
.err{margin:10px 0 0;padding:10px 12px;border-radius:10px;background:#FDECEC;border:1px solid #F3C2C2;color:#8E2B2B;font-size:14px;line-height:1.4}
.err a{color:#8E2B2B;font-weight:800}
.call{display:flex;align-items:center;justify-content:center;gap:8px;margin:14px 0 2px;padding-top:12px;border-top:1px solid rgba(11,79,85,.12);color:#3C6166;font-size:14px}
.call a{color:#0B4F55;font-weight:800;text-decoration:none;font-size:15px}
@media (max-width:290px){.row{grid-template-columns:1fr;gap:0}}
</style></head><body>
<form id="f" novalidate>
<p class="intro">We’ll call you to talk through next steps.</p>
<div class="row">
<label class="f"><span>First name</span><input type="text" name="firstName" autocomplete="given-name" maxlength="100" required></label>
<label class="f"><span>Last name</span><input type="text" name="lastName" autocomplete="family-name" maxlength="100" required></label>
</div>
<label class="f"><span>Phone</span><input type="tel" name="phone" autocomplete="tel" inputmode="tel" placeholder="(801) 555-0123" maxlength="20" required></label>
<label class="f"><span>Email</span><input type="email" name="email" autocomplete="email" inputmode="email" maxlength="150" required></label>
<div class="hp" aria-hidden="true"><label>Website<input type="text" name="website" tabindex="-1" autocomplete="off"></label></div>
<label class="c"><input type="checkbox" name="consent" required><span>I agree that Reach Higher ABA may contact me by phone call (including our automated assistant), email and text message about ABA services. Please don't share medical details here. Message and data rates may apply; message frequency varies. Reply STOP to opt out, HELP for help.</span></label>
<div class="links"><a href="https://reachhigheraba.com/privacy-policy/" target="_blank" rel="noopener">Privacy Policy</a> · <a href="https://reachhigheraba.com/terms-service/" target="_blank" rel="noopener">Terms</a></div>
<button type="submit">Send</button>
<div class="err" role="alert" hidden></div>
<div class="call">Prefer to talk? <a href="tel:+13852008674" target="_top">(385) 200-8674</a></div>
</form>
<script>
(function () {
  var API = 'https://app.intake2treatment.com/api/embed/lead/reach-higher-e339c5d82e', THANK_YOU = 'https://reachhigheraba.com/thank-you/';
  var PARENTS = ['https://reachhigheraba.com', 'http://127.0.0.1:8772'];          // only these pages may show this form
  var cfg = {}; try { location.hash.slice(1).split('&').forEach(function (kv) { var i = kv.indexOf('='); if (i > 0) cfg[kv.slice(0, i)] = decodeURIComponent(kv.slice(i + 1)); }); } catch (e) {}
  var parentOrigin = PARENTS.indexOf(cfg.po) >= 0 ? cfg.po : PARENTS[0];
  var PREVIEW = cfg.preview === '1';
  // only our own pages may show this form (blocks other sites framing it)
  var anc = location.ancestorOrigins && location.ancestorOrigins.length ? location.ancestorOrigins[0] : null;
  if (window.top === window || (anc && PARENTS.indexOf(anc) < 0)) {
    document.getElementById('f').innerHTML = '<p class="intro">To reach Reach Higher ABA, call <a href="tel:+13852008674">(385) 200-8674</a> or visit reachhigheraba.com.</p>'; return; }
  var tags = {}; try { tags = JSON.parse(cfg.tags || '{}') || {}; } catch (e) {}
  var f = document.getElementById('f'), err = f.querySelector('.err'), btn = f.querySelector('button');
  if (cfg.btn) btn.textContent = cfg.btn.slice(0, 40);
  function tell(msg) { try { parent.postMessage(msg, parentOrigin); } catch (e) {} }
  function size() { tell({rhForm: 'h', h: Math.ceil(f.getBoundingClientRect().bottom + window.scrollY + 6)}); }
  window.addEventListener('load', size); window.addEventListener('resize', size); setTimeout(size, 50);
  function el(n) { return f.elements[n]; }
  function val(n) { return (el(n).value || '').replace(/\s+/g, ' ').trim(); }
  function mark(n, bad) { var w = el(n).closest('label'); if (w) w.classList.toggle('bad', bad); return bad; }
  function show(msg) { err.innerHTML = msg; err.hidden = !msg; size(); }
  f.addEventListener('input', function (e) { var w = e.target.closest('label'); if (w) w.classList.remove('bad'); });
  f.addEventListener('submit', function (e) {
    e.preventDefault(); show('');
    var bad = [], d = val('phone').replace(/\D/g, ''); if (d.length === 11 && d[0] === '1') d = d.slice(1);
    if (mark('firstName', !val('firstName'))) bad.push('first name');
    if (mark('lastName', !val('lastName'))) bad.push('last name');
    if (mark('phone', !(d.length === 10 && /[2-9]/.test(d[0]) && /[2-9]/.test(d[3])))) bad.push('a 10-digit phone number');
    if (mark('email', !/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(val('email')))) bad.push('a valid email');
    if (mark('consent', !el('consent').checked)) bad.push('the consent box');
    if (bad.length) { show('Please add ' + bad.join(', ') + '.'); var b = f.querySelector('.bad input'); if (b) b.focus(); return; }
    if (val('website')) { tell({rhForm: 'done'}); return; }   // a bot filled the hidden box
    if (PREVIEW) { show('Preview only: this would go to ABA Ready, then the page would open the thank-you page. Nothing was sent.'); return; }
    btn.disabled = true; var label = btn.textContent; btn.textContent = 'Sending…';
    var adTags = {}; ['source', 'medium', 'campaign', 'term', 'content', 'gclid', 'fbclid', 'landingPath', 'referrerHost'].forEach(function (k) {
      if (typeof tags[k] === 'string' && tags[k]) adTags[k] = tags[k].slice(0, 150); });
    var body = JSON.stringify({firstName: val('firstName'), lastName: val('lastName'), email: val('email'), phone: d,
                               consent: true, website: '', adTags: adTags});
    fetch(API, {method: 'POST', mode: 'no-cors', headers: {'Content-Type': 'text/plain'}, body: body, keepalive: true})
      .then(function () {
        f.reset(); tell({rhForm: 'done'});
        setTimeout(function () { try { top.location.href = THANK_YOU; } catch (e) {} }, 1500);  // if the page didn't move
      })
      .catch(function () {
        btn.disabled = false; btn.textContent = label;
        show('We couldn’t send that just now. Please try again, or call us at <a href="tel:+13852008674" target="_top">(385) 200-8674</a>.');
      });
  });
})();
</script>
</body></html>
